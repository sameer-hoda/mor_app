<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log a meal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Mukta:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}*{box-sizing:border-box}button{font-family:inherit}</style>
</helmet>
<div style="width: 360px; height: 800px; font-family: 'Mukta', sans-serif; color: #142027; position: relative; overflow: hidden; background: #F8F5EE">
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0">
    <dc-import name="Home" state="default" hint-size="360px,1280px"></dc-import>
  </div>
  <a href="Home.dc.html" aria-label="Close" style="position: absolute; left: 0; top: 0; width: 360px; height: 800px; background: rgba(8, 30, 36, 0.55)"></a>

  <div style="position: absolute; left: 22px; top: 176px">
    <dc-import name="Neelu" mood="hungry" size="120" crop="head" hint-size="120px,120px"></dc-import>
  </div>

  <section role="dialog" aria-modal="true" aria-labelledby="addTitle" style="position: absolute; left: 0; right: 0; bottom: 0; top: 270px; background: #F8F5EE; border-radius: 28px 28px 0 0; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 14px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D9D2C2"></span>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 id="addTitle" style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 32px; line-height: 1">Log a meal</h1>
      <a href="Home.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 50%; background: #EFE9DC; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#142027" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6 L18 18 M18 6 L6 18"/></svg></a>
    </div>

    <div role="radiogroup" aria-label="Meal" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #EFE9DC; border-radius: 16px; padding: 4px; gap: 4px">
      <sc-for list="{{slots}}" as="s" hint-placeholder-count="4">
        <button type="button" role="radio" aria-checked="{{s.on}}" onClick="{{s.pick}}" style="height: 44px; border: none; border-radius: 12px; font-size: 14.5px; cursor: pointer; background: {{s.bg}}; color: {{s.fg}}; font-weight: {{s.fw}}; box-shadow: {{s.sh}}">{{s.label}}</button>
      </sc-for>
    </div>

    <a href="Camera.dc.html" style="position: relative; height: 92px; border-radius: 24px; background: #0B4A57; color: #FFFFFF; text-decoration: none; padding: 0 22px; display: flex; align-items: center; gap: 16px; overflow: hidden">
      <svg width="90" height="116" viewBox="0 0 20 26" aria-hidden="true" style="position: absolute; right: -18px; top: -12px; opacity: 0.3"><ellipse cx="10" cy="13" rx="9.5" ry="12.5" fill="#3FAE6E"/><ellipse cx="10" cy="12" rx="7" ry="9" fill="#F2B544"/><ellipse cx="10" cy="12.5" rx="5" ry="6.5" fill="#19A39A"/><ellipse cx="10" cy="13" rx="2.8" ry="3.8" fill="#2D2A6E"/></svg>
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#F2B544" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8 H8 L10 5 H14 L16 8 H20 V19 H4 Z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <strong style="position: relative; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 26px">Scan meal</strong>
    </a>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <a href="Search.dc.html" style="height: 84px; border-radius: 24px; background: #FFFFFF; color: #142027; text-decoration: none; padding: 0 18px; display: flex; align-items: center; gap: 12px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0B4A57" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M16 16 L20 20"/></svg>
        <strong style="font-size: 20px">Search</strong>
      </a>
      <a href="Search_voice.dc.html" style="height: 84px; border-radius: 24px; background: #FFFFFF; color: #142027; text-decoration: none; padding: 0 18px; display: flex; align-items: center; gap: 12px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0B4A57" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11 A7 7 0 0 0 19 11 M12 18 V21"/></svg>
        <strong style="font-size: 20px">Speak</strong>
      </a>
    </div>
    <div style="display: flex; gap: 8px">
      <a href="Camera.dc.html" style="flex: 1; height: 48px; border-radius: 24px; border: 1.5px solid #D9D2C2; background: #FFFFFF; color: #142027; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">Barcode</a>
      <a href="Scanning.dc.html" style="flex: 1; height: 48px; border-radius: 24px; border: 1.5px solid #D9D2C2; background: #FFFFFF; color: #142027; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">Gallery</a>
      <button type="button" style="flex: 1; height: 48px; border-radius: 24px; border: 1.5px solid #D9D2C2; background: #FFFFFF; color: #142027; font-size: 15px; font-weight: 600">Quick add</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const sel = (this.state || {}).slot || 'snack';
    const self = this;
    const slots = [{ id: 'breakfast', label: 'Breakfast' }, { id: 'lunch', label: 'Lunch' }, { id: 'snack', label: 'Snack' }, { id: 'dinner', label: 'Dinner' }].map(function (s) {
      const on = s.id === sel;
      return Object.assign({}, s, { on: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#0B4A57' : '#4A5A63', fw: on ? 700 : 600, sh: on ? '0 1px 3px rgba(20,32,39,0.15)' : 'none', pick: function () { self.setState({ slot: s.id }); } });
    });
    return { slots: slots };
  }
}
</script>
</body>
</html>
