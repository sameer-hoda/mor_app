<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Diet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Mukta:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}*{box-sizing:border-box}button{font-family:inherit}</style>
</helmet>
<div style="width: 360px; height: 800px; background: #F8F5EE; font-family: 'Mukta', sans-serif; color: #142027; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 14px; padding: 20px 16px 0">
    <a href="Goal_selected.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#142027" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19"/></svg></a>
    <div role="progressbar" aria-label="Step 2 of 6" aria-valuenow="2" aria-valuemin="0" aria-valuemax="6" style="flex: 1; height: 8px; border-radius: 4px; background: #E7E1D4; position: relative">
      <div style="width: 33.3%; height: 8px; border-radius: 4px; background: #0B4A57"></div>
      <svg width="16" height="20" viewBox="0 0 20 26" aria-hidden="true" style="position: absolute; left: calc(33.3% - 8px); top: -6px"><ellipse cx="10" cy="13" rx="9.5" ry="12.5" fill="#3FAE6E"/><ellipse cx="10" cy="12" rx="7" ry="9" fill="#F2B544"/><ellipse cx="10" cy="12.5" rx="5" ry="6.5" fill="#19A39A"/><ellipse cx="10" cy="13" rx="2.8" ry="3.8" fill="#2D2A6E"/></svg>
    </div>
  </div>

  <div style="padding: 24px 20px 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px">
    <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 36px; line-height: 1.05">How do<br>you eat?</h1>
    <div style="flex-shrink: 0; margin-right: -10px"><dc-import name="Neelu" mood="happy" size="92" crop="head" hint-size="92px,92px"></dc-import></div>
  </div>

  <div role="radiogroup" aria-label="Diet type" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 28px 16px 0">
    <sc-for list="{{diets}}" as="d" hint-placeholder-count="4">
      <button type="button" role="radio" aria-checked="{{d.on}}" onClick="{{d.pick}}" style="position: relative; height: 150px; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; color: #142027; cursor: pointer; background: {{d.bg}}; border: 2px solid {{d.bd}}">
        <sc-if value="{{d.isVeg}}" hint-placeholder-val="{{true}}"><svg width="36" height="36" viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="1" width="18" height="18" rx="2" fill="#fff" stroke="#1E8A5A" stroke-width="1.8"/><circle cx="10" cy="10" r="5" fill="#1E8A5A"/></svg></sc-if>
        <sc-if value="{{d.isEgg}}" hint-placeholder-val="{{false}}"><svg width="36" height="36" viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="1" width="18" height="18" rx="2" fill="#fff" stroke="#B9861A" stroke-width="1.8"/><ellipse cx="10" cy="10.5" rx="4.5" ry="5.5" fill="#E8B23A"/></svg></sc-if>
        <sc-if value="{{d.isNon}}" hint-placeholder-val="{{false}}"><svg width="36" height="36" viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="1" width="18" height="18" rx="2" fill="#fff" stroke="#7A3E1D" stroke-width="1.8"/><path d="M10 5 L15 14 L5 14 Z" fill="#7A3E1D"/></svg></sc-if>
        <strong style="font-size: 20px; font-weight: 700">{{d.title}}</strong>
        <sc-if value="{{d.sel}}" hint-placeholder-val="{{false}}">
          <svg width="22" height="28" viewBox="0 0 20 26" aria-hidden="true" style="position: absolute; right: 14px; top: 14px"><ellipse cx="10" cy="13" rx="9.5" ry="12.5" fill="#3FAE6E"/><ellipse cx="10" cy="12" rx="7" ry="9" fill="#F2B544"/><ellipse cx="10" cy="12.5" rx="5" ry="6.5" fill="#19A39A"/><ellipse cx="10" cy="13" rx="2.8" ry="3.8" fill="#2D2A6E"/></svg>
        </sc-if>
      </button>
    </sc-for>
  </div>

  <div style="margin-top: auto; padding: 0 16px 24px">
    <a href="Body.dc.html" style="position: relative; height: 60px; border-radius: 30px; background: #0B4A57; color: #FFFFFF; font-size: 19px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Next
      <span style="position: absolute; right: 9px; top: 9px; width: 42px; height: 42px; border-radius: 50%; background: #F2B544; display: flex; align-items: center; justify-content: center"><span style="width: 32px; height: 32px; border-radius: 50%; background: #19A39A; display: flex; align-items: center; justify-content: center"><span style="width: 23px; height: 23px; border-radius: 50%; background: #2D2A6E; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12 H19 M13 6 L19 12 L13 18"/></svg></span></span></span>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const diet = (this.state || {}).diet || 'veg';
    const self = this;
    const diets = [
      { id: 'veg', title: 'Vegetarian', mark: 'veg' },
      { id: 'egg', title: 'Eggetarian', mark: 'egg' },
      { id: 'non', title: 'Non-veg', mark: 'non' },
      { id: 'vegan', title: 'Vegan', mark: 'veg' }
    ].map(function (d) {
      const on = d.id === diet;
      return Object.assign({}, d, { on: on ? 'true' : 'false', sel: on, isVeg: d.mark === 'veg', isEgg: d.mark === 'egg', isNon: d.mark === 'non', bg: on ? '#E3F2EF' : '#FFFFFF', bd: on ? '#0B4A57' : '#FFFFFF', pick: function () { self.setState({ diet: d.id }); } });
    });
    return { diets: diets };
  }
}
</script>
</body>
</html>
