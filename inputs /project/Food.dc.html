<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["thali","chai","poha","idli","dosa","dal","roti","rice","paneer","samosa","fruit","curd","biryani","paratha","sprouts","makhana"],"default":"thali"},"size":{"editor":"int","min":16,"max":400,"default":96},"$preview":{"width":96,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    const kind = this.props.kind || 'thali';
    const size = Number(this.props.size) || 96;
    const bgs = { chai: '#F6E7D8', poha: '#FFF4D6', idli: '#EAF4EE', dosa: '#FFF1DD', dal: '#FFF6E0', roti: '#F7EEDD', rice: '#EEF2F4', paneer: '#FFE8DC', samosa: '#FFF0D9', fruit: '#FFF9DA', curd: '#EEF4FA', biryani: '#FFEBD6', paratha: '#F8EDD8', sprouts: '#E9F5E4', makhana: '#F6EFE4', thali: 'transparent' };
    const k = {};
    Object.keys(bgs).forEach(function (n) { k[n] = n === kind; });
    return { k: k, sz: size + 'px', bg: bgs[kind] || '#F3EFE6', label: kind };
  }
}
</script>
