<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your goal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Mukta:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}*{box-sizing:border-box}button{font-family:inherit}</style>
</helmet>
<div style="width: 360px; height: 800px; background: #F8F5EE; font-family: 'Mukta', sans-serif; color: #142027; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 14px; padding: 20px 16px 0">
    <a href="MeetNeelu.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#142027" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19"/></svg></a>
    <div role="progressbar" aria-label="Step 1 of 6" aria-valuenow="1" aria-valuemin="0" aria-valuemax="6" style="flex: 1; height: 8px; border-radius: 4px; background: #E7E1D4; position: relative">
      <div style="width: 16.7%; height: 8px; border-radius: 4px; background: #0B4A57"></div>
      <svg width="16" height="20" viewBox="0 0 20 26" aria-hidden="true" style="position: absolute; left: calc(16.7% - 8px); top: -6px"><ellipse cx="10" cy="13" rx="9.5" ry="12.5" fill="#3FAE6E"/><ellipse cx="10" cy="12" rx="7" ry="9" fill="#F2B544"/><ellipse cx="10" cy="12.5" rx="5" ry="6.5" fill="#19A39A"/><ellipse cx="10" cy="13" rx="2.8" ry="3.8" fill="#2D2A6E"/></svg>
    </div>
  </div>

  <div style="padding: 24px 20px 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px">
    <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 36px; line-height: 1.05">What's your goal?</h1>
    <div style="flex-shrink: 0; margin-right: -10px"><dc-import name="Neelu" mood="happy" size="92" crop="head" hint-size="92px,92px"></dc-import></div>
  </div>

  <div role="radiogroup" aria-label="Goal" style="display: flex; flex-direction: column; gap: 12px; padding: 24px 16px 0">
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
      <button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 12px 16px; border-radius: 20px; text-align: left; color: #142027; cursor: pointer; background: {{o.bg}}; border: 2px solid {{o.bd}}">
        <span style="width: 46px; height: 46px; flex-shrink: 0; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: {{o.tint}}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{o.ink}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.icon}}"/></svg>
        </span>
        <strong style="flex: 1; font-size: 19px; font-weight: 600">{{o.title}}</strong>
        <sc-if value="{{o.sel}}" hint-placeholder-val="{{false}}">
          <svg width="22" height="28" viewBox="0 0 20 26" aria-hidden="true"><ellipse cx="10" cy="13" rx="9.5" ry="12.5" fill="#3FAE6E"/><ellipse cx="10" cy="12" rx="7" ry="9" fill="#F2B544"/><ellipse cx="10" cy="12.5" rx="5" ry="6.5" fill="#19A39A"/><ellipse cx="10" cy="13" rx="2.8" ry="3.8" fill="#2D2A6E"/></svg>
        </sc-if>
        <sc-if value="{{o.unsel}}" hint-placeholder-val="{{true}}">
          <span style="width: 24px; height: 24px; border-radius: 50%; border: 2px solid #CFC8B8; flex-shrink: 0"></span>
        </sc-if>
      </button>
    </sc-for>
  </div>

  <div style="margin-top: auto; padding: 0 16px 24px">
    <sc-if value="{{ready}}" hint-placeholder-val="{{false}}">
      <a href="Diet.dc.html" style="position: relative; height: 60px; border-radius: 30px; background: #0B4A57; color: #FFFFFF; font-size: 19px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Next
        <span style="position: absolute; right: 9px; top: 9px; width: 42px; height: 42px; border-radius: 50%; background: #F2B544; display: flex; align-items: center; justify-content: center"><span style="width: 32px; height: 32px; border-radius: 50%; background: #19A39A; display: flex; align-items: center; justify-content: center"><span style="width: 23px; height: 23px; border-radius: 50%; background: #2D2A6E; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12 H19 M13 6 L19 12 L13 18"/></svg></span></span></span>
      </a>
    </sc-if>
    <sc-if value="{{notReady}}" hint-placeholder-val="{{true}}">
      <button type="button" disabled style="width: 100%; height: 60px; border-radius: 30px; border: none; background: #E3DDD0; color: #5A564D; font-size: 19px; font-weight: 600">Next</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["empty","selected"],"default":"empty"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const sel = st.sel !== undefined ? st.sel : (this.props.state === 'selected' ? 'lose' : null);
    const self = this;
    const opts = [
      { id: 'lose', title: 'Lose weight', icon: 'M12 4 V20 M6 14 L12 20 L18 14', tint: '#FFF1DD', ink: '#B9661A' },
      { id: 'maintain', title: 'Maintain weight', icon: 'M5 9 H19 M5 15 H19', tint: '#E3F2EF', ink: '#0B4A57' },
      { id: 'gain', title: 'Gain weight', icon: 'M12 20 V4 M6 10 L12 4 L18 10', tint: '#E6ECFA', ink: '#1F4FB5' },
      { id: 'healthy', title: 'Eat healthier', icon: 'M5 19 Q5 6 19 5 Q19 18 6 19 M5 19 L13 11', tint: '#E3F4EA', ink: '#1E8A5A' }
    ].map(function (o) {
      const on = o.id === sel;
      return Object.assign({}, o, { on: on ? 'true' : 'false', sel: on, unsel: !on, bg: on ? '#E3F2EF' : '#FFFFFF', bd: on ? '#0B4A57' : '#FFFFFF', pick: function () { self.setState({ sel: o.id }); } });
    });
    return { opts: opts, ready: !!sel, notReady: !sel };
  }
}
</script>
</body>
</html>
