<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meal detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Mukta:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}*{box-sizing:border-box}button{font-family:inherit}</style>
</helmet>
<div style="width: 360px; height: 1100px; background: #DFF1EA; font-family: 'Mukta', sans-serif; color: #142027; position: relative; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 10px; padding: 18px 16px 0">
    <a href="Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#142027" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19"/></svg></a>
    <h1 style="flex: 1; margin: 0; text-align: center; font-size: 20px; font-weight: 700">Lunch · 1:20 PM</h1>
    <button type="button" aria-label="Edit meal" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#142027" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20 H8 L19 9 L15 5 L4 16 Z"/></svg></button>
  </div>

  <div style="position: relative; height: 230px; display: flex; justify-content: center; align-items: center">
    <span style="width: 210px; height: 210px; border-radius: 50%; background: #CBE7DC; display: flex; align-items: center; justify-content: center"><dc-import name="Food" kind="thali" size="190" hint-size="190px,190px"></dc-import></span>
    <span style="position: absolute; left: 20px; bottom: 6px; width: 64px; height: 64px; border-radius: 50%; background: #FFFFFF; overflow: hidden; display: flex; align-items: center; justify-content: center"><dc-import name="Neelu" mood="love" size="70" crop="head" hint-size="70px,70px"></dc-import></span>
  </div>

  <div style="background: #F8F5EE; border-radius: 28px 28px 0 0; padding: 18px 16px 120px; display: flex; flex-direction: column; gap: 12px; min-height: 830px">
    <section style="background: #FFFFFF; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <strong style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 54px; line-height: 1">590 <span style="font-size: 20px; color: #5E6D75">kcal</span></strong>
        <span style="padding: 4px 12px; border-radius: 999px; background: #DDF1E6; color: #155E3D; font-size: 16px; font-weight: 700">78 · Good</span>
      </div>
      <div aria-hidden="true" style="display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 3px"><span style="width: 56%; background: #F2A93B"></span><span style="width: 18%; background: #1F4FB5"></span><span style="flex: 1; background: #19A39A"></span></div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
        <span style="display: flex; flex-direction: column"><strong style="font-size: 22px">82g</strong><span style="font-size: 15px; color: #4A5A63">carbs</span></span>
        <span style="display: flex; flex-direction: column"><strong style="font-size: 22px">19g</strong><span style="font-size: 15px; color: #4A5A63">protein</span></span>
        <span style="display: flex; flex-direction: column"><strong style="font-size: 22px">18g</strong><span style="font-size: 15px; color: #4A5A63">fat</span></span>
      </div>
    </section>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <a href="Badge.dc.html" style="background: #FFFFFF; border-radius: 20px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: #142027">
        <svg width="48" height="52" viewBox="0 0 64 70" aria-hidden="true"><path d="M32 2 L60 18 V52 L32 68 L4 52 V18 Z" fill="#FFF3DC" stroke="#F2A93B" stroke-width="3"/><path d="M20 44 L32 26 L44 44 Z" fill="#C4673A"/><rect x="28" y="34" width="8" height="10" fill="#F8F5EE"/></svg>
        <span style="font-size: 14px; font-weight: 700">Home-cooked</span></a>
      <a href="Badge.dc.html" style="background: #FFFFFF; border-radius: 20px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: #142027">
        <svg width="48" height="52" viewBox="0 0 64 70" aria-hidden="true"><path d="M32 2 L60 18 V52 L32 68 L4 52 V18 Z" fill="#E3F4EA" stroke="#1E8A5A" stroke-width="3"/><path d="M24 46 Q22 26 42 22 Q44 42 24 46 Z M24 46 L36 32" fill="#5DB35A" stroke="#1E8A5A" stroke-width="2"/></svg>
        <span style="font-size: 14px; font-weight: 700">High fibre</span></a>
      <a href="Badge.dc.html" style="background: #FFFFFF; border-radius: 20px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: #142027">
        <svg width="48" height="52" viewBox="0 0 64 70" aria-hidden="true"><path d="M32 2 L60 18 V52 L32 68 L4 52 V18 Z" fill="#E6ECFA" stroke="#1F4FB5" stroke-width="3"/><rect x="22" y="26" width="20" height="18" rx="3" fill="#FFFFFF" stroke="#1F4FB5" stroke-width="2"/><path d="M20 22 L44 48" stroke="#D9483B" stroke-width="3" stroke-linecap="round"/></svg>
        <span style="font-size: 14px; font-weight: 700">Low sugar</span></a>
    </div>

    <section style="background: #FFFFFF; border-radius: 24px; padding: 4px 16px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="5">
        <a href="FoodItem.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 62px; border-top: {{it.bt}}; text-decoration: none; color: #142027">
          <dc-import name="Food" kind="{{it.k}}" size="42" hint-size="42px,42px"></dc-import>
          <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.2"><strong style="font-size: 17px">{{it.name}}</strong><span style="font-size: 14px; color: #4A5A63">{{it.portion}}</span></span>
          <strong style="font-size: 17px">{{it.kcal}}</strong>
        </a>
      </sc-for>
    </section>

    <section style="background: #E6ECFA; border-radius: 24px; padding: 16px; display: flex; gap: 12px; align-items: center">
      <span style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><dc-import name="Neelu" mood="cool" size="50" crop="head" hint-size="50px,50px"></dc-import></span>
      <p style="margin: 0; font-size: 17px; font-weight: 600; line-height: 1.35; color: #1A2F66">Add a bowl of curd for +6 g protein.</p>
    </section>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 16px 24px; background: #F8F5EE">
    <a href="Home.dc.html" style="height: 60px; border-radius: 30px; background: #0B4A57; color: #FFFFFF; font-size: 19px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Done</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const items = [
      { k: 'dal', name: 'Dal tadka', portion: '1 bowl', kcal: 150 },
      { k: 'poha', name: 'Aloo gobhi', portion: '1 bowl', kcal: 120 },
      { k: 'rice', name: 'Jeera rice', portion: '¾ plate', kcal: 170 },
      { k: 'roti', name: 'Roti', portion: '2 pieces', kcal: 120 },
      { k: 'curd', name: 'Raita & salad', portion: '½ bowl', kcal: 30 }
    ].map(function (it, i) { return Object.assign({}, it, { bt: i === 0 ? 'none' : '1px solid #F1ECE1' }); });
    return { items: items };
  }
}
</script>
</body>
</html>
