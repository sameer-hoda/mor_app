<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bottom navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Mukta:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Main" style="width: 360px; height: 84px; position: relative; font-family: 'Mukta', sans-serif; color: #142027">
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 70px; background: #FFFFFF; border-top: 1px solid #E7E1D4; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 0 4px">
    <a href="Home.dc.html" aria-label="Home" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: {{c.home}}">
      <span style="width: 56px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; background: {{bg.home}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 11 L12 4 L20 11 V20 H14 V14 H10 V20 H4 Z"/></svg>
      </span>
      <span style="font-size: 12px; font-weight: 600">Home</span>
    </a>
    <a href="Insights.dc.html" aria-label="Insights" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: {{c.insights}}">
      <span style="width: 56px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; background: {{bg.insights}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 20 V12 M12 20 V5 M19 20 V9"/></svg>
      </span>
      <span style="font-size: 12px; font-weight: 600">Insights</span>
    </a>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; padding-bottom: 9px">
      <span style="font-size: 12px; font-weight: 600; color: #0B4A57">Log</span>
    </div>
    <a href="Challenges.dc.html" aria-label="Challenges" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: {{c.challenges}}">
      <span style="width: 56px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; background: {{bg.challenges}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 L20 7.5 V16.5 L12 21 L4 16.5 V7.5 Z"/><path d="M12 8.5 l1.2 2.5 2.7 .3 -2 1.8 .6 2.7 -2.5 -1.4 -2.5 1.4 .6 -2.7 -2 -1.8 2.7 -.3 Z" stroke-width="1.5"/></svg>
      </span>
      <span style="font-size: 12px; font-weight: 600">Challenges</span>
    </a>
    <a href="Profile.dc.html" aria-label="Profile" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: {{c.profile}}">
      <span style="width: 56px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; background: {{bg.profile}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20 Q4 14 12 14 Q20 14 20 20"/></svg>
      </span>
      <span style="font-size: 12px; font-weight: 600">Profile</span>
    </a>
  </div>
  <a href="AddSheet.dc.html" aria-label="Log a meal" style="position: absolute; left: 148px; top: 0; width: 64px; height: 64px; border-radius: 50%; background: #0B4A57; border: 3px solid #F2B544; box-shadow: 0 0 0 4px #FFFFFF, 0 6px 16px rgba(11, 74, 87, 0.35); display: flex; align-items: center; justify-content: center; text-decoration: none">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5 V19 M5 12 H19"/></svg>
    <svg width="14" height="18" viewBox="0 0 20 26" aria-hidden="true" style="position: absolute; right: -4px; top: -6px"><ellipse cx="10" cy="13" rx="9.5" ry="12.5" fill="#3FAE6E"/><ellipse cx="10" cy="12" rx="7" ry="9" fill="#F2B544"/><ellipse cx="10" cy="12.5" rx="5" ry="6.5" fill="#19A39A"/><ellipse cx="10" cy="13" rx="2.8" ry="3.8" fill="#2D2A6E"/></svg>
  </a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","insights","challenges","profile"],"default":"home"},"$preview":{"width":360,"height":84}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'home';
    const c = {}, bg = {};
    ['home', 'insights', 'challenges', 'profile'].forEach(function (k) {
      c[k] = k === a ? '#0B4A57' : '#5E6D75';
      bg[k] = k === a ? '#D3EBE6' : 'transparent';
    });
    return { c: c, bg: bg };
  }
}
</script>
</body>
</html>
