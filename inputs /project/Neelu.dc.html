</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["happy","cool","joy","love","hungry","thinking","sleepy"],"default":"happy"},"size":{"editor":"int","min":24,"max":600,"default":200},"crop":{"editor":"enum","options":["full","head"],"default":"full"},"$preview":{"width":240,"height":240}}'>
class Component extends DCLogic {
  renderVals() {
    const mood = this.props.mood || 'happy';
    const size = Number(this.props.size) || 240;
    const crop = this.props.crop || 'full';
    return {
      sz: size + 'px',
      vb: crop === 'head' ? '36 8 128 128' : '0 0 200 200',
      label: 'Neelu the peacock, ' + mood,
      isHappy: mood === 'happy',
      isCool: mood === 'cool',
      isJoy: mood === 'joy',
      isLove: mood === 'love',
      isHungry: mood === 'hungry',
      isThinking: mood === 'thinking',
      isSleepy: mood === 'sleepy'
    };
  }
}
</script>
