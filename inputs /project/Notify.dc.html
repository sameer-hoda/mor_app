<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reminder permission</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Mukta:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}*{box-sizing:border-box}</style>
</helmet>
<div style="width: 360px; height: 800px; background: #F8F5EE; font-family: 'Mukta', sans-serif; color: #142027; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center">
  <div style="position: relative; width: 360px; height: 400px; background: #E6F3EF; display: flex; justify-content: center; align-items: flex-end">
    <svg width="360" height="400" viewBox="0 0 360 400" aria-hidden="true" style="position: absolute; left: 0; top: 0"><g fill="none" stroke="#0B4A57" stroke-opacity="0.07" stroke-width="2"><circle cx="180" cy="260" r="130"/><circle cx="180" cy="260" r="190"/></g></svg>
    <div style="position: relative; margin-bottom: -24px"><dc-import name="Neelu" mood="happy" size="300" hint-size="300px,300px"></dc-import></div>
    <span style="position: absolute; right: 44px; top: 70px; width: 64px; height: 64px; border-radius: 50%; background: #F2B544; display: flex; align-items: center; justify-content: center; transform: rotate(14deg)">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#142027" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16 V11 A6 6 0 0 1 18 11 V16 L20 18 H4 Z M10 21 H14"/></svg>
    </span>
  </div>
  <h1 style="margin: 44px 24px 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 36px; line-height: 1.08; text-align: center">Remind you at mealtimes?</h1>
  <p style="margin: 10px 0 0; font-size: 18px; color: #4A5A63">Max 4 a day. Never at night.</p>

  <div style="margin-top: auto; padding: 0 16px 20px; width: 100%; display: flex; flex-direction: column; gap: 6px">
    <a href="Notify_system.dc.html" style="position: relative; height: 60px; border-radius: 30px; background: #0B4A57; color: #FFFFFF; font-size: 19px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Yes, remind me
      <span style="position: absolute; right: 9px; top: 9px; width: 42px; height: 42px; border-radius: 50%; background: #F2B544; display: flex; align-items: center; justify-content: center"><span style="width: 32px; height: 32px; border-radius: 50%; background: #19A39A; display: flex; align-items: center; justify-content: center"><span style="width: 23px; height: 23px; border-radius: 50%; background: #2D2A6E; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12 H19 M13 6 L19 12 L13 18"/></svg></span></span></span>
    </a>
    <a href="Home_firstday.dc.html" style="height: 52px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; color: #0B4A57; text-decoration: none">Not now</a>
  </div>

  <sc-if value="{{sys}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 0; top: 0; width: 360px; height: 800px; background: rgba(10, 20, 24, 0.55); display: flex; align-items: center; justify-content: center; padding: 24px">
      <div role="dialog" aria-modal="true" aria-labelledby="sysTitle" style="width: 100%; background: #F3F0F7; border-radius: 28px; padding: 24px 20px 12px; display: flex; flex-direction: column; align-items: center; gap: 14px; font-family: 'Roboto', 'Mukta', sans-serif">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3B3A55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16 V11 A6 6 0 0 1 18 11 V16 L20 18 H4 Z M10 21 H14"/></svg>
        <p id="sysTitle" style="margin: 0; text-align: center; font-size: 21px; line-height: 1.3; color: #1C1B1F">Allow <strong>Mor</strong> to send you notifications?</p>
        <div style="width: 100%; display: flex; flex-direction: column; gap: 4px; margin-top: 6px">
          <a href="Home_firstday.dc.html" style="height: 48px; border-radius: 24px; background: #DCD8EC; color: #1C1B1F; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Allow</a>
          <a href="Home_firstday.dc.html" style="height: 48px; border-radius: 24px; color: #3B3A55; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Don't allow</a>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["pre","system"],"default":"pre"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return { sys: this.props.state === 'system' }; }
}
</script>
</body>
</html>
