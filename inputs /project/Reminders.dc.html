<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reminders</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Mukta:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}*{box-sizing:border-box}button{font-family:inherit}</style>
</helmet>
<div style="width: 360px; height: 900px; background: #F8F5EE; font-family: 'Mukta', sans-serif; color: #142027; position: relative; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 10px; padding: 18px 16px 0">
    <a href="Profile.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; border: 1px solid #E7E1D4; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#142027" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19"/></svg></a>
    <h1 style="flex: 1; margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 26px">Reminders</h1>
    <span style="width: 44px; height: 44px; border-radius: 50%; background: #DDEFEA; overflow: hidden; display: flex; align-items: center; justify-content: center"><dc-import name="Neelu" mood="{{mood}}" size="50" crop="head" hint-size="50px,50px"></dc-import></span>
  </div>

  <div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <sc-if value="{{off}}" hint-placeholder-val="{{false}}">
      <div role="alert" style="background: #FFF1EE; border: 1.5px solid #F3C5BE; border-radius: 18px; padding: 12px 14px; display: flex; gap: 10px; align-items: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A2A20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6 16 V11 A6 6 0 0 1 15 6 M18 11 V16 L20 18 H6 M10 21 H14 M3 3 L21 21"/></svg>
        <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.25"><strong style="font-size: 17px; color: #7A2018">Notifications are off</strong></span>
        <button type="button" style="height: 38px; padding: 0 14px; border-radius: 19px; border: none; background: #0B4A57; color: #FFFFFF; font-size: 14px; font-weight: 700">Turn on</button>
      </div>
    </sc-if>

    <sc-for list="{{sections}}" as="s" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 6px; opacity: {{dim}}">
        <h2 style="margin: 0; padding: 0 4px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #4A5A63">{{s.title}}</h2>
        <div style="background: #FFFFFF; border: 1px solid #EDE7DA; border-radius: 20px; padding: 0 14px">
          <sc-for list="{{s.rows}}" as="r" hint-placeholder-count="4">
            <div style="display: flex; align-items: center; gap: 10px; min-height: 58px; border-top: {{r.bt}}">
              <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.25"><strong style="font-size: 17px">{{r.label}}</strong><span style="font-size: 12.5px; color: #4A5A63">{{r.sub}}</span></span>
              <sc-if value="{{r.hasTime}}" hint-placeholder-val="{{true}}"><button type="button" aria-label="{{r.timeLabel}}" style="height: 34px; padding: 0 10px; border-radius: 10px; border: 1.5px solid #D9D2C2; background: #F8F5EE; font-size: 14px; font-weight: 700; color: #142027">{{r.time}}</button></sc-if>
              <button type="button" role="switch" aria-checked="{{r.on}}" aria-label="{{r.label}}" onClick="{{r.toggle}}" style="width: 48px; height: 28px; border-radius: 14px; position: relative; flex-shrink: 0; cursor: pointer; padding: 0; background: {{r.track}}; border: 2px solid {{r.trackBd}}">
                <span style="position: absolute; top: 2px; width: 20px; height: 20px; border-radius: 50%; left: {{r.knobX}}; background: {{r.knob}}"></span>
              </button>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>

    <section style="background: #FFFFFF; border: 1px solid #EDE7DA; border-radius: 20px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; opacity: {{dim}}">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="display: flex; flex-direction: column; line-height: 1.25"><strong style="font-size: 17px">Quiet hours</strong></span>
        <span style="font-size: 14.5px; font-weight: 700">10:30 PM – 7:00 AM</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #F1ECE1; padding-top: 10px">
        <span style="display: flex; flex-direction: column; line-height: 1.25"><strong style="font-size: 17px">Max a day</strong></span>
        <div style="display: flex; align-items: center; gap: 10px">
          <button type="button" aria-label="Fewer" style="width: 36px; height: 36px; border-radius: 10px; border: 1.5px solid #D9D2C2; background: #FFFFFF; font-size: 18px; color: #0B4A57">−</button>
          <strong style="font-size: 18px">4</strong>
          <button type="button" aria-label="More" style="width: 36px; height: 36px; border-radius: 10px; border: none; background: #0B4A57; font-size: 18px; color: #FFFFFF">+</button>
        </div>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["on","off"],"default":"on"},"$preview":{"width":360,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const sysOff = this.props.state === 'off';
    const offMap = (this.state || {}).offMap || {};
    const self = this;
    const r = function (id, label, sub, time) {
      const on = !sysOff && !offMap[id];
      return { id: id, label: label, sub: sub, time: time || '', hasTime: !!time, timeLabel: label + ' at ' + time, on: on ? 'true' : 'false',
        track: on ? '#0B4A57' : '#E3DDD0', trackBd: on ? '#0B4A57' : '#8C8676', knob: on ? '#F2B544' : '#8C8676', knobX: on ? '22px' : '2px',
        toggle: function () { if (sysOff) return; const n = Object.assign({}, offMap); n[id] = on; self.setState({ offMap: n }); } };
    };
    const sec = function (title, rows) { return { title: title, rows: rows.map(function (x, i) { return Object.assign({}, x, { bt: i === 0 ? 'none' : '1px solid #F1ECE1' }); }) }; };
    return {
      off: sysOff, dim: sysOff ? 0.55 : 1, mood: sysOff ? 'hungry' : 'happy',
      sections: [
        sec('Meals', [r('breakfast', 'Breakfast', '', '8:30 AM'), r('lunch', 'Lunch', '', '1:30 PM'), r('snack', 'Snack', '', '5:00 PM'), r('dinner', 'Dinner', '', '9:00 PM')]),
        sec('Nudges', [r('missed', 'Missed meal', 'Once, 90 min later'), r('streak', 'Streak saver', '', '10:00 PM'), r('water', 'Water', 'Every 2 hours'), r('report', 'Weekly report', 'Sundays')])
      ]
    };
  }
}
</script>
</body>
</html>
