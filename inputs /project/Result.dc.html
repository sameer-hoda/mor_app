<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scan result</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Mukta:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}*{box-sizing:border-box}button{font-family:inherit}</style>
</helmet>
<div style="width: 360px; height: 800px; background: #0E1A1F; font-family: 'Mukta', sans-serif; color: #142027; position: relative; overflow: hidden">
  <div style="position: absolute; left: 90px; top: 34px; width: 180px; height: 180px; border-radius: 50%; background: #3B2B21; overflow: hidden; border: 3px solid {{ringColor}}">
    <div style="position: absolute; left: 10px; top: 10px"><dc-import name="Food" kind="thali" size="154" hint-size="154px,154px"></dc-import></div>
    <sc-if value="{{failed}}" hint-placeholder-val="{{false}}">
      <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 180px; height: 180px; background: rgba(5, 10, 12, 0.72)"></div>
    </sc-if>
  </div>
  <sc-if value="{{showTags}}" hint-placeholder-val="{{true}}">
    <div aria-hidden="true">
      <span style="position: absolute; left: 124px; top: 84px; width: 22px; height: 22px; border-radius: 50%; background: {{tag1}}; color: #142027; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFFFF">1</span>
      <span style="position: absolute; left: 172px; top: 52px; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; color: #142027; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">2</span>
      <span style="position: absolute; left: 194px; top: 128px; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; color: #142027; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">3</span>
      <span style="position: absolute; left: 128px; top: 130px; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; color: #142027; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">4</span>
      <span style="position: absolute; left: 212px; top: 86px; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; color: #142027; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">5</span>
    </div>
  </sc-if>
  <a href="Camera.dc.html" aria-label="Back to camera" style="position: absolute; left: 16px; top: 18px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6 L18 18 M18 6 L6 18"/></svg></a>

  <sc-if value="{{showList}}" hint-placeholder-val="{{true}}">
    <section aria-labelledby="mealTitle" style="position: absolute; left: 0; right: 0; bottom: 0; top: 232px; background: #F8F5EE; border-radius: 28px 28px 0 0; padding: 10px 16px 18px; display: flex; flex-direction: column; gap: 10px">
      <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D9D2C2"></span>
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="flex: 1; display: flex; flex-direction: column; line-height: 1.1">
          <button type="button" style="align-self: flex-start; border: none; background: none; padding: 0; font-size: 13.5px; font-weight: 600; color: #4A5A63; display: flex; align-items: center; gap: 4px">Lunch · Today 1:20 PM<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#4A5A63" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 9 L12 15 L18 9"/></svg></button>
          <h1 id="mealTitle" style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 30px; display: flex; align-items: center; gap: 8px">Your meal <span style="font-family: 'Mukta', sans-serif; font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: #EFE9DC">×1</span></h1>
        </div>
        <button type="button" aria-label="Discard meal" style="width: 40px; height: 40px; border-radius: 50%; border: none; background: #EFE9DC; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A5A63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7 H19 M10 7 V4 H14 V7 M7 7 L8 20 H16 L17 7"/></svg></button>
      </div>

      <sc-if value="{{unsure}}" hint-placeholder-val="{{false}}">
        <div style="background: #FFF3DC; border: 1.5px solid #F2D9A6; border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; align-items: center; gap: 8px">
            <span style="width: 22px; height: 22px; border-radius: 50%; background: #F2B544; color: #142027; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">1</span>
            <strong style="flex: 1; font-size: 18px; color: #5C3A05">Rajma or chole?</strong>
          </div>
          <div role="radiogroup" aria-label="Which dish is item 1" style="display: flex; gap: 8px">
            <button type="button" role="radio" aria-checked="false" style="flex: 1; height: 40px; border-radius: 20px; border: 1.5px solid #C98A1E; background: #FFFFFF; font-size: 14.5px; font-weight: 700; color: #142027">Rajma</button>
            <button type="button" role="radio" aria-checked="false" style="flex: 1; height: 40px; border-radius: 20px; border: 1.5px solid #C98A1E; background: #FFFFFF; font-size: 14.5px; font-weight: 700; color: #142027">Chole</button>
            <button type="button" style="height: 40px; padding: 0 12px; border-radius: 20px; border: none; background: transparent; font-size: 14px; font-weight: 600; color: #5C3A05; text-decoration: underline">Other</button>
          </div>
        </div>
      </sc-if>

      <div style="background: #FFFFFF; border: 1px solid #EDE7DA; border-radius: 20px; padding: 0 12px">
        <sc-for list="{{items}}" as="it" hint-placeholder-count="5">
          <div style="display: flex; align-items: center; gap: 10px; min-height: 56px; border-top: {{it.bt}}">
            <span style="position: relative; display: flex">
              <dc-import name="Food" kind="{{it.k}}" size="38" hint-size="38px,38px"></dc-import>
              <span style="position: absolute; left: -4px; top: -4px; width: 17px; height: 17px; border-radius: 50%; background: #142027; color: #FFFFFF; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{it.n}}</span>
            </span>
            <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.2; min-width: 0">
              <span style="font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 4px">{{it.name}}<svg width="12" height="12" viewBox="0 0 24 24" aria-label="AI estimate" role="img"><path d="M12 2 L13.8 9 L21 11 L13.8 13 L12 20 L10.2 13 L3 11 L10.2 9 Z" fill="{{it.spark}}"/></svg></span>
              <button type="button" style="align-self: flex-start; border: none; background: none; padding: 0; font-size: 13px; color: #0B4A57; font-weight: 600; display: flex; align-items: center; gap: 3px">{{it.portion}}<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#0B4A57" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 9 L12 15 L18 9"/></svg></button>
            </span>
            <span style="font-size: 14.5px; font-weight: 700; white-space: nowrap">{{it.kcal}}</span>
          </div>
        </sc-for>
      </div>

      <div style="display: flex; align-items: center; gap: 10px">
        <span style="font-size: 15px; font-weight: 600; color: #4A5A63; white-space: nowrap">Oil</span>
        <div role="radiogroup" aria-label="Oil level" style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #EFE9DC; border-radius: 14px; padding: 3px; gap: 3px">
          <button type="button" role="radio" aria-checked="false" style="height: 36px; border: none; border-radius: 11px; background: transparent; font-size: 13.5px; font-weight: 600; color: #4A5A63">Less</button>
          <button type="button" role="radio" aria-checked="true" style="height: 36px; border: none; border-radius: 11px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(20,32,39,0.15); font-size: 13.5px; font-weight: 700; color: #0B4A57">Normal</button>
          <button type="button" role="radio" aria-checked="false" style="height: 36px; border: none; border-radius: 11px; background: transparent; font-size: 13.5px; font-weight: 600; color: #4A5A63">More</button>
        </div>
      </div>

      <div style="margin-top: auto; display: flex; gap: 10px; align-items: center">
        <a href="Search.dc.html" aria-label="Add another item" style="width: 56px; height: 56px; border-radius: 50%; background: #FFFFFF; border: 1.5px solid #D9D2C2; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B4A57" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5 V19 M5 12 H19"/></svg></a>
        <a href="Logged.dc.html" style="position: relative; flex: 1; height: 56px; border-radius: 28px; background: #0B4A57; color: #FFFFFF; font-size: 18px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; padding-right: 36px">Log <span style="opacity: 0.75; margin-left: 6px">590 kcal</span>
          <span style="position: absolute; right: 8px; top: 8px; width: 40px; height: 40px; border-radius: 50%; background: #F2B544; display: flex; align-items: center; justify-content: center"><span style="width: 30px; height: 30px; border-radius: 50%; background: #19A39A; display: flex; align-items: center; justify-content: center"><span style="width: 22px; height: 22px; border-radius: 50%; background: #2D2A6E; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12 L10 17 L19 7"/></svg></span></span></span>
        </a>
      </div>
    </section>
  </sc-if>

  <sc-if value="{{failed}}" hint-placeholder-val="{{false}}">
    <section role="alert" style="position: absolute; left: 0; right: 0; bottom: 0; top: 232px; background: #F8F5EE; border-radius: 28px 28px 0 0; padding: 0 20px 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
      <div style="margin-top: -60px"><dc-import name="Neelu" mood="hungry" size="150" hint-size="150px,150px"></dc-import></div>
      <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 32px; line-height: 1.1">Couldn't see the food</h1>
      <p style="margin: 0; font-size: 18px; color: #4A5A63">Too dark. Try better light.</p>
      <div style="margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 8px">
        <a href="Camera.dc.html" style="height: 54px; border-radius: 27px; background: #0B4A57; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Retake photo</a>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <a href="Search.dc.html" style="height: 48px; border-radius: 24px; border: 1.5px solid #0B4A57; color: #0B4A57; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Search food</a>
          <a href="Search_voice.dc.html" style="height: 48px; border-radius: 24px; border: 1.5px solid #0B4A57; color: #0B4A57; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Speak</a>
        </div>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["detected","unsure","failed"],"default":"detected"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.state || 'detected';
    const unsure = s === 'unsure', failed = s === 'failed';
    const items = [
      { n: 1, k: 'dal', name: unsure ? 'Rajma / chole?' : 'Dal tadka', portion: '1 bowl', kcal: unsure ? '— kcal' : '150 kcal' },
      { n: 2, k: 'poha', name: 'Aloo gobhi', portion: '1 bowl', kcal: '120 kcal' },
      { n: 3, k: 'rice', name: 'Jeera rice', portion: '¾ plate', kcal: '170 kcal' },
      { n: 4, k: 'roti', name: 'Phulka roti', portion: '2 pieces', kcal: '120 kcal' },
      { n: 5, k: 'curd', name: 'Raita + salad', portion: '½ bowl', kcal: '30 kcal' }
    ].map(function (it, i) { return Object.assign({}, it, { bt: i === 0 ? 'none' : '1px solid #F1ECE1', spark: (unsure && i === 0) ? '#F2A93B' : '#2D2A6E' }); });
    return {
      items: unsure ? items.slice(1) : items,
      unsure: unsure, failed: failed, showList: !failed, showTags: !failed,
      tag1: unsure ? '#F2B544' : '#FFFFFF',
      ringColor: failed ? '#D9483B' : '#F2B544'
    };
  }
}
</script>
</body>
</html>
