<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Target weight</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Mukta:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}*{box-sizing:border-box}button{font-family:inherit}</style>
</helmet>
<div style="width: 360px; height: 800px; background: #F8F5EE; font-family: 'Mukta', sans-serif; color: #142027; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 14px; padding: 20px 16px 0">
    <a href="Body.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#142027" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19"/></svg></a>
    <div role="progressbar" aria-label="Step 4 of 6" aria-valuenow="4" aria-valuemin="0" aria-valuemax="6" style="flex: 1; height: 8px; border-radius: 4px; background: #E7E1D4; position: relative">
      <div style="width: 66.7%; height: 8px; border-radius: 4px; background: #0B4A57"></div>
      <svg width="16" height="20" viewBox="0 0 20 26" aria-hidden="true" style="position: absolute; left: calc(66.7% - 8px); top: -6px"><ellipse cx="10" cy="13" rx="9.5" ry="12.5" fill="#3FAE6E"/><ellipse cx="10" cy="12" rx="7" ry="9" fill="#F2B544"/><ellipse cx="10" cy="12.5" rx="5" ry="6.5" fill="#19A39A"/><ellipse cx="10" cy="13" rx="2.8" ry="3.8" fill="#2D2A6E"/></svg>
    </div>
  </div>

  <div style="padding: 24px 20px 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px">
    <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 36px; line-height: 1.05">Target<br>weight?</h1>
    <div style="flex-shrink: 0; margin-right: -10px"><dc-import name="Neelu" mood="{{mood}}" size="92" crop="head" hint-size="92px,92px"></dc-import></div>
  </div>

  <div style="position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 28px; height: 250px">
    <div aria-hidden="true" style="position: absolute; left: 16px; right: 16px; top: 90px; height: 76px; border-radius: 22px; background: #FFFFFF"></div>
    <div role="spinbutton" aria-label="Target weight in kilograms" aria-valuenow="{{c}}" style="position: relative; display: flex; flex-direction: column; align-items: center; font-family: 'Baloo 2', sans-serif; font-weight: 800; line-height: 1">
      <span style="font-size: 26px; color: #C9C2B2; height: 42px">{{m2}}</span>
      <span style="font-size: 34px; color: #9E978A; height: 50px">{{m1}}</span>
      <span style="font-size: 68px; color: #142027; height: 76px; padding-top: 6px">{{c}}</span>
      <span style="font-size: 34px; color: #9E978A; height: 50px; padding-top: 6px">{{p1}}</span>
      <span style="font-size: 26px; color: #C9C2B2; height: 32px">{{p2}}</span>
    </div>
    <span style="position: relative; font-size: 22px; font-weight: 700; color: #4A5A63">kg</span>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 18px; padding: 0 20px; text-align: center">
    <span style="padding: 6px 16px; border-radius: 999px; font-size: 17px; font-weight: 700; background: {{pillBg}}; color: {{pillFg}}">{{pill}}</span>
    <span style="font-size: 19px; font-weight: 600; color: #2E4A50">{{line}}</span>
    <sc-if value="{{amb}}" hint-placeholder-val="{{false}}">
      <button type="button" style="height: 48px; padding: 0 20px; border-radius: 24px; border: 2px solid #0B4A57; background: #FFFFFF; color: #0B4A57; font-size: 17px; font-weight: 700">Start with 66 kg</button>
    </sc-if>
  </div>

  <div style="margin-top: auto; padding: 0 16px 24px">
    <a href="Activity.dc.html" style="position: relative; height: 60px; border-radius: 30px; background: #0B4A57; color: #FFFFFF; font-size: 19px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Next
      <span style="position: absolute; right: 9px; top: 9px; width: 42px; height: 42px; border-radius: 50%; background: #F2B544; display: flex; align-items: center; justify-content: center"><span style="width: 32px; height: 32px; border-radius: 50%; background: #19A39A; display: flex; align-items: center; justify-content: center"><span style="width: 23px; height: 23px; border-radius: 50%; background: #2D2A6E; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12 H19 M13 6 L19 12 L13 18"/></svg></span></span></span>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["realistic","ambitious"],"default":"realistic"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const amb = this.props.state === 'ambitious';
    const c = amb ? 55 : 66;
    return {
      amb: amb, c: c, m2: c - 2, m1: c - 1, p1: c + 1, p2: c + 2,
      mood: amb ? 'thinking' : 'joy',
      pill: amb ? '−17 kg · Ambitious' : '−6 kg · Realistic',
      pillBg: amb ? '#FDEBC8' : '#DDF1E6',
      pillFg: amb ? '#7A4B05' : '#155E3D',
      line: amb ? 'Big jump. Go in steps?' : 'By 19 Jan 2027'
    };
  }
}
</script>
</body>
</html>
