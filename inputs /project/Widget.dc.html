<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home-screen widgets</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Mukta:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}*{box-sizing:border-box}</style>
</helmet>
<div style="width: 360px; height: 800px; background: #2F6F6A; font-family: 'Mukta', sans-serif; color: #142027; position: relative; overflow: hidden">
  <svg width="360" height="800" viewBox="0 0 360 800" aria-hidden="true" style="position: absolute; left: 0; top: 0">
    <circle cx="280" cy="110" r="46" fill="#F2C46B" opacity="0.6"/>
    <path d="M0 520 Q90 460 180 500 T360 480 V800 H0 Z" fill="#285F5B"/>
    <path d="M0 600 Q120 550 240 590 T360 570 V800 H0 Z" fill="#214F4C"/>
  </svg>
  <div style="position: relative; margin: 40px 16px 0; height: 48px; border-radius: 24px; background: rgba(255,255,255,0.92); display: flex; align-items: center; gap: 10px; padding: 0 16px; color: #4A5A63; font-size: 15px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A5A63" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M16 16 L20 20"/></svg>Search</div>

  <div style="position: relative; margin: 20px 16px 0; background: #FFFFFF; border-radius: 28px; padding: 14px 16px; display: flex; align-items: center; gap: 10px; height: 160px">
    <div style="flex-shrink: 0; margin-left: -8px"><dc-import name="Neelu" mood="happy" size="120" hint-size="120px,120px"></dc-import></div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
      <span style="display: flex; flex-direction: column; line-height: 1.05"><strong style="font-family: 'Baloo 2', sans-serif; font-size: 30px">940</strong><span style="font-size: 13px; color: #4A5A63">kcal left</span></span>
      <div aria-hidden="true" style="display: flex; gap: 4px"><span style="flex: 1; height: 6px; border-radius: 3px; background: #F2A93B"></span><span style="flex: 1; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #1F4FB5 41%, #EAE4D6 41%)"></span><span style="flex: 1; height: 6px; border-radius: 3px; background: #19A39A"></span></div>
      <div style="display: flex; gap: 6px; margin-top: 2px">
        <a href="Camera.dc.html" style="flex: 1; height: 36px; border-radius: 18px; background: #0B4A57; color: #FFFFFF; font-size: 13.5px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Scan</a>
        <span style="flex: 1; height: 36px; border-radius: 18px; background: #DDF3F1; color: #0F5E59; font-size: 13.5px; font-weight: 700; display: flex; align-items: center; justify-content: center">+ Water</span>
      </div>
    </div>
  </div>

  <div style="position: relative; margin: 14px 16px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
    <div style="background: #FFF3DC; border-radius: 28px; height: 156px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between">
      <svg width="40" height="40" viewBox="0 0 60 60" aria-hidden="true"><path d="M30 6 Q40 20 30 32 Q20 20 30 6 Z" fill="#F2A93B"/><path d="M30 16 Q35 24 30 30 Q25 24 30 16 Z" fill="#FFD86B"/><path d="M8 34 Q30 58 52 34 Z" fill="#C4673A"/></svg>
      <span style="display: flex; flex-direction: column; line-height: 1"><strong style="font-family: 'Baloo 2', sans-serif; font-size: 44px">6</strong><span style="font-size: 14px; font-weight: 600; color: #5C3A05">day streak</span></span>
    </div>
    <div style="background: #0B4A57; color: #FFFFFF; border-radius: 28px; height: 156px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between">
      <div style="display: flex; justify-content: space-between; align-items: flex-start"><span style="font-size: 13px; color: #BFE0DD; line-height: 1.2">Next<br><strong style="font-size: 16px; color: #FFFFFF">Snack · 5 PM</strong></span><dc-import name="Food" kind="chai" size="40" hint-size="40px,40px"></dc-import></div>
      <a href="AddSheet.dc.html" style="height: 38px; border-radius: 19px; background: #F2B544; color: #142027; font-size: 14px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Log it</a>
    </div>
  </div>

  <div style="position: relative; margin: 26px 16px 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; text-align: center">
    <span style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="width: 56px; height: 56px; border-radius: 18px; background: #0B4A57; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 2px solid #F2B544"><dc-import name="Neelu" mood="cool" size="62" crop="head" hint-size="62px,62px"></dc-import></span><span style="font-size: 12.5px; color: #FFFFFF; font-weight: 600">Mor</span></span>
    <span style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="width: 56px; height: 56px; border-radius: 18px; background: #E9EEF0; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#4A5A63" stroke-width="2" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10 H20"/></svg></span><span style="font-size: 12.5px; color: #FFFFFF">Calendar</span></span>
    <span style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="width: 56px; height: 56px; border-radius: 18px; background: #E9EEF0; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#4A5A63" stroke-width="2" aria-hidden="true"><path d="M4 8 H8 L10 5 H14 L16 8 H20 V19 H4 Z"/><circle cx="12" cy="13" r="3.5"/></svg></span><span style="font-size: 12.5px; color: #FFFFFF">Camera</span></span>
    <span style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="width: 56px; height: 56px; border-radius: 18px; background: #E9EEF0; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#4A5A63" stroke-width="2" aria-hidden="true"><path d="M5 5 H19 V15 H9 L5 19 Z"/></svg></span><span style="font-size: 12.5px; color: #FFFFFF">Messages</span></span>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 16px; right: 16px; bottom: 28px; height: 76px; border-radius: 28px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: space-around">
    <span style="width: 50px; height: 50px; border-radius: 16px; background: #E9EEF0"></span><span style="width: 50px; height: 50px; border-radius: 16px; background: #E9EEF0"></span><span style="width: 50px; height: 50px; border-radius: 16px; background: #E9EEF0"></span><span style="width: 50px; height: 50px; border-radius: 16px; background: #E9EEF0"></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
